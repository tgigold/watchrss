name: Deploy

# Lädt den Stand von main per FTPS (lftp) auf den Server.
#
# Benötigt im Environment "production" (Settings → Environments):
#   Secrets:  FTP_SERVER      Server-Name des Hosters, z. B. w0123456.kasserver.com
#                             (nicht die eigene Domain - sonst passt das
#                             TLS-Zertifikat nicht)
#             FTP_USERNAME
#             FTP_PASSWORD
#             FTP_SERVER_DIR  Zielverzeichnis, z. B. /watchrss/
#                             (Projektstamm, NICHT www/)
#
# Es wird nur hochgeladen, nie gelöscht (kein --delete). Auf dem Server
# bleiben damit config.inc.php, var/cache/ und alles andere unangetastet.
# lftp statt FTP-Deploy-Action, weil deren FTP-Bibliothek beim FTPS-
# Datenkanal von all-inkl mit ECONNRESET abbricht.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    # Deployed wird nur nach grüner CI.
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: PHP einrichten
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: curl, json, libxml, mbstring, pdo, pdo_mysql, simplexml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Autoloader erzeugen
        run: |
          composer install --no-dev --no-interaction --no-progress --optimize-autoloader
          # vendor/ ist nicht im Repo - Zugriffssperre wie für src/ & Co.
          cp src/.htaccess vendor/.htaccess

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Per FTPS hochladen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          # Ohne Zielverzeichnis landet alles in der Wurzel des FTP-Zugangs.
          # Ist der FTP-Benutzer schon auf das Projektverzeichnis beschränkt,
          # FTP_SERVER_DIR auf "./" setzen.
          if [ -z "$FTP_SERVER_DIR" ]; then
            echo "::error::Secret FTP_SERVER_DIR fehlt oder ist leer."
            exit 1
          fi
          lftp -c "
            set cmd:fail-exit true
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate true
            set ftp:passive-mode true
            set net:timeout 20
            set net:max-retries 3
            set net:reconnect-interval-base 5
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\"
            mirror --reverse --verbose --parallel=4 --no-perms \
              -x '^[.]git' \
              -x '^[.]claude/' \
              -x '(^|/)[.]DS_Store$' \
              -x '^config[.]inc[.]php$' \
              -x '^var/cache/' \
              -x '^var/log/' \
              -x '^(README|CHANGELOG)[.]md$' \
              -x '^LICENSE$' \
              -x '^tests/' \
              -x '^php(unit[.]xml|stan[.]neon)[.]dist$' \
              . \"$FTP_SERVER_DIR\"
          "
