name: Deploy

# Lädt den Stand von main per FTPS (lftp) auf den Server.
#
# Benötigt im Environment "production" (Settings → Environments):
#   Secrets:  FTP_SERVER      Hostname, z. B. w0123456.kasserver.com
#             FTP_USERNAME
#             FTP_PASSWORD
#             FTP_SERVER_DIR  Zielverzeichnis, z. B. /watchrss/
#                             (Projektstamm, NICHT www/)
#
# Es wird nur hochgeladen, nie gelöscht (kein --delete). Auf dem Server
# bleiben damit config.inc.php, var/ und alles andere unangetastet.
# lftp statt FTP-Deploy-Action, weil deren FTP-Bibliothek beim FTPS-
# Datenkanal von all-inkl mit ECONNRESET abbricht.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: PHP einrichten
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: curl, json, libxml, mbstring, pdo, pdo_mysql, simplexml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Syntax prüfen
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Autoloader erzeugen
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Per FTPS hochladen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -c "
            set cmd:fail-exit true
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate true
            set ftp:passive-mode true
            set net:timeout 20
            set net:max-retries 3
            set net:reconnect-interval-base 5
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\"
            mirror --reverse --verbose --parallel=4 --no-perms \
              -x '^[.]git' \
              -x '^[.]claude/' \
              -x '(^|/)[.]DS_Store$' \
              -x '^config[.]inc[.]php$' \
              -x '^var/' \
              -x '^(README|CHANGELOG)[.]md$' \
              -x '^LICENSE$' \
              . \"$FTP_SERVER_DIR\"
          "
