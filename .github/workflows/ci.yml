name: CI

# Lint, Tests und statische Analyse bei jedem Push und Pull Request.
# Für main ruft der Deploy-Workflow diesen Workflow selbst auf und deployt
# nur, wenn er grün ist - deshalb hier kein eigener push-Trigger für main.

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: PHP einrichten
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, libxml, mbstring, pdo, pdo_mysql, simplexml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: composer.json prüfen
        run: composer validate --strict

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --no-progress

      - name: Syntax prüfen
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests (PHPUnit)
        run: vendor/bin/phpunit

      - name: Statische Analyse (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
